services:
  api-test:
    build: .
    container_name: gptic-api-test
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=testing
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped